name: image
# Builds the hosted service's container and publishes it to GitHub Container Registry.
# The workflow's own GITHUB_TOKEN signs in; no secret is stored anywhere.
on:
  push:
    branches: [main]
    paths: ["justify/**", "deploy/**", "pyproject.toml", ".github/workflows/image.yml"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Justify hosted service
            org.opencontainers.image.licenses=MIT
          tags: |
            ghcr.io/bpskartik/justify:latest
            ghcr.io/bpskartik/justify:${{ github.sha }}
