[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "justify-code"
version = "1.0.0"
description = "Every line of AI-written code must justify its existence."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Kartik Chaturvedi"}]
dependencies = []
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
    "Environment :: Console",
]

[project.urls]
Repository = "https://github.com/BPSKartik/justify"

[project.optional-dependencies]
mcp = ["mcp>=2,<3"]
hosted = ["mcp>=2,<3", "uvicorn>=0.30", "starlette>=0.37"]
dev = ["pytest>=8", "httpx"]

[project.scripts]
justify = "justify.cli:main"
justify-mcp = "justify.mcp_server:main"

[tool.setuptools]
packages = ["justify", "justify.hosted"]

[tool.setuptools.package-data]
"justify.hosted" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
