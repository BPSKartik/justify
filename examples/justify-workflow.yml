# Copy to .github/workflows/justify.yml in the repository you want checked.
name: justify
on: pull_request

jobs:
  justify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history, so each line can be attributed to AI or human
      - uses: BPSKartik/justify@main
        with:
          test-command: python -m pytest -q
