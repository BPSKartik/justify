# Copy to .github/workflows/justify.yml in the repository you want checked.
# Keep the trigger on pull_request, never pull_request_target: the proof runs the pull request's own tests.
name: justify
on: pull_request

permissions:
  contents: read

jobs:
  justify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0              # full history, so each line can be attributed to AI or human
          persist-credentials: false
      - uses: BPSKartik/justify@v1
        with:
          python-version: "3.12"                     # your project's Python
          install-command: pip install -e . pytest   # or: pip install -r requirements.txt pytest
          test-command: python -m pytest -q          # leave out to scan without proof
